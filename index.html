<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Jertaker Ecosystem</title>
<link rel="icon" href="favicon.png">
<style>
:root{
  --bg:#0b0e14;--card:#12161f;--card2:#161b26;--line:#232a38;--gold:#d4af37;--gold2:#f0d078;
  --txt:#e8e4d8;--dim:#8b93a5;--green:#3ddc84;--blue:#5aa7ff;--red:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:76px}
a{color:var(--blue);text-decoration:none}
.hide{display:none!important}
/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b0e14 70%,rgba(11,14,20,.92));border-bottom:1px solid var(--line);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.emblem{width:34px;height:34px;flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 14px rgba(212,175,55,.45)}
header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
header .sub{font-size:11px;color:var(--dim);margin-top:1px}
.spacer{flex:1}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--dim);cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(212,175,55,.14);border-color:var(--gold);color:var(--gold2)}
/* layout */
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);margin:6px 0 10px;font-weight:700}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--gold2)}
.stat span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--gold),#b8932c);color:#14100a;font-weight:700;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.mini{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:15px;font-family:inherit;margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
label{font-size:12px;color:var(--dim);display:block;margin:4px 0 4px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0d1017f2;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;text-align:center;color:var(--dim);font-size:10px;cursor:pointer;padding:2px 0;position:relative}
.tab svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.tab.on{color:var(--gold2)}
.dot{position:absolute;top:0;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.post{border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:12px;margin-bottom:10px}
.post .t{font-weight:700;font-size:15px;margin-bottom:3px}
.post .meta{font-size:11.5px;color:var(--dim);margin-bottom:8px}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(212,175,55,.12);color:var(--gold2);border:1px solid rgba(212,175,55,.3);margin-right:6px}
.pill.qa{background:rgba(90,167,255,.12);color:var(--blue);border-color:rgba(90,167,255,.3)}
.pill.win{background:rgba(61,220,132,.12);color:var(--green);border-color:rgba(61,220,132,.3)}
.pill.res{background:rgba(61,220,132,.16);color:var(--green);border-color:rgba(61,220,132,.4)}
.cmt{border-top:1px solid var(--line);padding:8px 0 2px;font-size:13.5px}
.cmt .who{color:var(--gold2);font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini-link{font-size:12px;color:var(--dim);cursor:pointer;text-decoration:underline}
/* chat dock */
.chatdock{position:fixed;right:12px;bottom:82px;z-index:40;width:min(360px,calc(100vw - 24px));background:var(--card);border:1px solid var(--gold);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:70vh}
.chatdock .hd{padding:9px 12px;background:rgba(212,175,55,.1);font-size:13px;font-weight:700;color:var(--gold2);display:flex;justify-content:space-between;cursor:pointer}
.fab{position:fixed;right:14px;bottom:86px;z-index:35;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#b8932c);color:#14100a;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 18px rgba(212,175,55,.4)}
/* hero + home v2 */
.hero{position:relative;background:#0b0e14;padding:0;overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-in{position:relative;padding:26px 16px 24px;text-align:center;background:linear-gradient(180deg,rgba(8,10,16,.10) 0%,rgba(8,10,16,.25) 45%,rgba(8,10,16,.70) 100%)}
.hero-tag{margin:14px auto 16px;max-width:430px;font-weight:700;font-size:13px;line-height:1.5;letter-spacing:.3px;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--gold);color:#fff}
.card.pinned{border-color:rgba(212,175,55,.5)}
.pin-ic{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(212,175,55,.08);flex:0 0 44px}
.badge{display:inline-block;background:var(--gold);color:#14100a;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;border-radius:6px;padding:3px 8px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 10px}
.h2row .h2{margin:0}
.viewall{color:var(--gold2);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.empty{text-align:center;padding:26px 16px}
.em-ic{font-size:26px}
.chatmsgs{overflow-y:auto;padding:10px 12px;flex:1;min-height:120px}
.cmsg{margin-bottom:8px;font-size:13.5px}
.cmsg .who{color:var(--gold2);font-size:11px}
.chatinput{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatinput input{margin:0}
.evdate{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;min-width:56px}
.evdate b{display:block;font-size:20px;color:var(--gold2)}
.evdate span{font-size:10px;color:var(--dim);text-transform:uppercase}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.lbrow .rank{width:26px;text-align:center;color:var(--dim);font-weight:700}
.lbrow .pts{margin-left:auto;color:var(--gold2);font-weight:700}
.goalbar{height:10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;background:#1d2432;border:1px solid var(--gold);color:var(--txt);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.small{font-size:12.5px;color:var(--dim);line-height:1.5}
.modgrp{margin-bottom:16px}
.lesson{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.lesson .dur{color:var(--dim);font-size:12px;flex:none}
@media(min-width:700px){body{padding-bottom:20px}.tabbar{display:none}.desknav{display:flex;gap:8px;overflow-x:auto}}
.desknav{display:none}

/* v3 mockup pass */
body{background:radial-gradient(560px 360px at 12% -6%,rgba(197,160,89,.15),transparent 60%),radial-gradient(520px 340px at 90% 2%,rgba(197,160,89,.10),transparent 60%),radial-gradient(780px 540px at 50% 116%,rgba(104,66,135,.10),transparent 62%),var(--bg);background-attachment:fixed}
#profbtn{background:transparent;border:1.2px solid var(--gold);color:var(--gold2);font-weight:700}
.hero-in{padding:34px 16px 28px}
.hero-in .crown-img{width:150px;height:auto;margin:0 auto 12px;display:block;filter:drop-shadow(0 0 14px rgba(212,175,55,.35))}
.hero-in .brand{font-size:24px;font-weight:800;letter-spacing:2.5px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.hero-in .brand-sub{font-size:10.5px;font-weight:700;letter-spacing:2.6px;color:var(--gold2);margin-top:6px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.hero-tag{margin:14px auto 16px;max-width:430px;font-weight:700;font-size:13px;line-height:1.5;letter-spacing:.3px;color:#fff}
.pin-ic{color:var(--gold2)}
.pin-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.em-ic{color:var(--gold2)}
.em-ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin:0 auto}
.fab{background:rgba(13,16,23,.92);border:1.5px solid var(--gold);color:var(--gold2);display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(212,175,55,.45),0 4px 18px rgba(0,0,0,.5)}
.fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab{display:flex;flex-direction:column;align-items:center;padding:5px 0 3px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.tab .tl{font-size:9.5px;letter-spacing:.2px;display:block}
.tab.on{color:var(--gold2)}
.tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:22px;height:2px;border-radius:2px;background:var(--gold)}
/* v5: real backgrounds */
.card.hero{background-color:#0b0e14;background-size:cover;background-position:center;padding:0;border-color:rgba(212,175,55,.55);min-height:430px}
.card.hero .hero-in{background:linear-gradient(180deg,rgba(6,8,14,.05) 0%,rgba(6,8,14,.18) 50%,rgba(6,8,14,.62) 100%);padding:38px 16px 28px;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.card.hero .crown-img{width:150px;height:auto;display:block;margin:0 auto 10px}
.card.pinned{background-color:#0b0e14;background-size:cover;background-position:center;border-color:rgba(212,175,55,.5)}

.card.empty{background-color:#0b0e14;background-size:cover;background-position:right center;border-color:rgba(212,175,55,.4);text-align:left;padding:26px 16px;min-height:130px}
.card.empty .em-ic{margin:0 0 6px}
.card.empty .em-ic svg{margin:0}

.card.empty{background-image:linear-gradient(90deg,rgba(6,8,14,.80) 0%,rgba(6,8,14,.40) 55%,rgba(6,8,14,.05) 100%),url('ev_bg.jpg?v=1') !important;background-size:cover !important;background-position:right center !important}

/* v6: hero typography matched to mockup */
.card.hero .brand-main{font-family:'Montserrat',system-ui,sans-serif;font-weight:700;font-size:46px;letter-spacing:3px;line-height:1.05;margin-top:2px;background:linear-gradient(180deg,#ffffff 0%,#e6e8ee 40%,#9aa0ac 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.card.hero .brand-intl{font-family:'Montserrat',system-ui,sans-serif;font-weight:600;font-size:19px;letter-spacing:9px;margin:4px 0 0 9px;color:#d9ac4f;background:linear-gradient(180deg,#f2cd7a,#b98a35);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.card.hero .brand-sub{font-family:'Montserrat',system-ui,sans-serif;font-weight:500;font-size:10.5px;letter-spacing:3px;color:#f1f1f1;margin-top:14px}
.card.hero .hero-tag{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:500;font-size:19px;line-height:1.35;letter-spacing:.2px;color:#f4f1ea;max-width:360px;margin:16px auto 20px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.card.hero .btn.ghost{background:rgba(8,10,16,.55);border:1.5px solid #c9a24a;color:#f6e6b4;font-weight:600;padding:12px 34px;border-radius:14px;box-shadow:0 0 16px rgba(212,175,55,.25)}

.card.hero .hero-in{background:linear-gradient(180deg,rgba(6,8,14,.10) 0%,rgba(6,8,14,.42) 38%,rgba(6,8,14,.72) 100%) !important}
.card.hero .brand-sub{text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);font-weight:600}

/* v7: pinned badge + megaphone container per Boss annotation */
.card.pinned .badge{display:inline-flex;align-items:center;background:rgba(10,11,18,.62);color:#ecd9a0;border:1px solid rgba(212,175,55,.55);border-radius:999px;padding:5px 14px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card.pinned .pin-ic{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(212,175,55,.75);display:flex;align-items:center;justify-content:center;flex:0 0 46px;background:rgba(10,11,18,.55);box-shadow:0 0 14px rgba(212,175,55,.22), inset 0 0 10px rgba(212,175,55,.08)}
.card.pinned .pin-ic svg{width:24px;height:24px}
.card.pinned .t{text-shadow:0 1px 6px rgba(0,0,0,.8)}
.card.pinned .small{text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* v8: pinned card matches Boss target (gold megaphone, right side, glowing frame) */
.card.pinned .pin-ic{width:74px;height:74px;flex:0 0 74px;border-radius:16px;border:1.5px solid rgba(233,191,85,.9);background:linear-gradient(145deg,rgba(26,18,8,.92),rgba(8,8,14,.92));box-shadow:0 0 18px rgba(233,191,85,.35), inset 0 0 14px rgba(233,191,85,.12)}
.card.pinned .pin-ic svg{width:44px;height:44px;stroke:none;fill:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}

/* v9: slick megaphone frame per Boss target */
.card.pinned .pin-ic{width:78px;height:78px;flex:0 0 78px;border-radius:20px;position:relative;border:1.5px solid #FAD991;background:linear-gradient(150deg,rgba(26,15,46,.85) 0%,rgba(8,8,14,.94) 60%,rgba(20,12,34,.85) 100%);box-shadow:0 0 22px rgba(250,217,145,.45),0 0 46px rgba(233,191,85,.22),inset 0 0 18px rgba(250,217,145,.14),inset 0 1px 0 rgba(255,255,255,.18)}
.card.pinned .pin-ic::after{content:"";position:absolute;inset:-7px;border-radius:26px;border:1px solid rgba(250,217,145,.22);pointer-events:none}
.card.pinned .pin-ic svg{width:48px;height:48px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.65)) drop-shadow(0 0 6px rgba(250,217,145,.35))}

/* v10: megaphone smaller + vertically centered per Boss */
.card.pinned .pin-ic{width:54px;height:54px;flex:0 0 54px;border-radius:14px;align-self:center}
.card.pinned .pin-ic::after{inset:-5px;border-radius:19px}
.card.pinned .pin-ic svg{width:32px;height:32px}
.card.pinned .pin-ic{box-shadow:0 0 16px rgba(250,217,145,.4),0 0 32px rgba(233,191,85,.18),inset 0 0 12px rgba(250,217,145,.13),inset 0 1px 0 rgba(255,255,255,.16)}

/* v11: pinned card — text flows beside icon, icon centers on full card */
.card.pinned{padding:16px}
.pin-row{display:flex;align-items:center;gap:14px}
.pin-col{flex:1;min-width:0}
.card.pinned .pin-ic{width:54px;height:54px;flex:0 0 54px;border-radius:14px}

/* v12: blurred night-city page background like the mockup */
body::before{content:"";position:fixed;inset:-40px;z-index:-2;background:url('hero_bg.jpg?v=2') center/cover no-repeat;filter:blur(7px) brightness(.55) saturate(1.05)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,9,16,.42),rgba(8,9,16,.66))}
@media(min-width:700px){body::before{filter:blur(9px) brightness(.5)}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet"></head>
<body>
<header>
  <img class="emblem" src="jg_emblem.png" alt="JG emblem">
  <div><h1>Jertaker Ecosystem</h1><div class="sub" id="whoami">One place for everything</div></div>
  <div class="spacer"></div>
  <div class="chip" id="profbtn" onclick="go('profile')">Sign in</div>
</header>
<nav class="desknav" id="desknav" style="padding:10px 16px;gap:8px"></nav>
<main id="view"></main>
<button class="fab" id="chatfab" onclick="toggleChat()" aria-label="Live chat"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg></button>
<div class="chatdock hide" id="chatdock">
  <div class="hd" onclick="toggleChat()"><span>Live Chat</span><span>✕</span></div>
  <div class="chatmsgs" id="chatmsgs"></div>
  <div class="chatinput" id="chatform">
    <input id="chattext" placeholder="Say hi…" maxlength="500" onkeydown="if(event.key==='Enter')sendChat()">
    <button class="btn mini" onclick="sendChat()">→</button>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script>
const API="https://base44.app/api/apps/6a9224f8c29c628aa348d1ac/functions/communityApi";
const TOKEN_KEY="vh_token", MEMBER_KEY="vh_member";
let token=localStorage.getItem(TOKEN_KEY)||"";
let member=null; try{member=JSON.parse(localStorage.getItem(MEMBER_KEY)||"null")}catch(e){}
let tab="home", channel="announcements", lastChatId=null, chatOpen=false, unread=0;
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const fmt=t=>{if(!t)return"";const d=new Date(String(t).replace(" ","T"));return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})};
async function api(op,data={},tok){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify({op,...data})});const j=await r.json();if(!j.ok&&r.status===401&&tok===token){logout()}return j}catch(e){return{ok:false,error:"Network hiccup. Try again."}}}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.2)}catch(e){}}
function setHeader(){const p=$("profbtn");if(member){p.textContent=member.name.split(" ")[0];$("whoami").textContent=(member.audience||"member")+" · "+(member.points||0)+" pts"}else{p.textContent="Sign in";$("whoami").textContent="Customer hub"}}
function logout(){token="";member=null;localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(MEMBER_KEY);setHeader();render()}
function go(t){tab=t;render();window.scrollTo(0,0)}
/* ---------- tabs ---------- */
const IC={};
IC.home='<svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>';
IC.tag='<svg viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".9" fill="currentColor" stroke="none"/></svg>';
IC.cal='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
IC.book='<svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>';
IC.dots='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>';
IC.bot='<svg viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>';

const TABS=[["home","Home"],["deals","Deals & Offers"],["events","Events"],["resources","Resources"],["other","More"],["guide","Guide"]];
function drawTabs(){const bar=$("tabbar");bar.innerHTML=TABS.map(([id,l])=>`<div class="tab ${tab===id?"on":""}" onclick="go('${id}')">${IC[id]}<span class="tl">${l}</span></div>`).join("");
 const dn=$("desknav");dn.innerHTML=TABS.map(([id,l])=>`<div class="chip ${tab===id?"on":""}" onclick="go('${id}')">${l}</div>`).join("")+`<div class="chip ${tab==="profile"?"on":""}" onclick="go('profile')">Profile</div>`}
/* ---------- views ---------- */
async function render(){drawTabs();const v=$("view");
 if(tab==="home"){
  let cached=null; try{cached=JSON.parse(localStorage.getItem("vh_home")||"null")}catch(e){}
  if(cached&&cached.stats){paintHome(cached)}else{v.innerHTML='<div class="card"><span class="small">Loading…</span></div>'}
  const j=await api("home");
  if(j&&j.stats){try{localStorage.setItem("vh_home",JSON.stringify(j))}catch(e){};paintHome(j)}
 }
 else if(tab==="deals"){await renderGated(v,"deals","Deals and Offers","Offers from the team, just for customers.","No deals right now. When the team posts an offer, it shows up here.")}
 else if(tab==="events"){if(!isCust()){v.innerHTML=gateCard("Events");return} v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';const j=await api("events");const now=new Date().toISOString();
  const up=(j.events||[]).filter(e=>e.startsAt>now),past=(j.events||[]).filter(e=>e.startsAt<=now).slice(-3).reverse();
  v.innerHTML=`<div class="h2">Upcoming</div>${up.map(e=>evCard(e)).join("")||'<div class="card"><span class="small">No events yet.</span></div>'}`+
  (past.length?`<div class="h2">Recent</div>${past.map(e=>`<div class="card"><b>${esc(e.title)}</b><div class="small">${fmt(e.startsAt)}</div></div>`).join("")}`:"");
 }
 else if(tab==="resources"){await renderResources(v)}
 else if(tab==="other"){await renderOther(v)}
 else if(tab==="guide"){v.innerHTML=`<div class="h2">Guide</div>
 <div class="card"><p class="small">Ask anything. The Guide searches the team's approved library and cites its sources; questions it can't answer get logged for the team.</p>
 <div class="row"><input id="gq" style="flex:1" placeholder="Ask the Guide…" maxlength="300" onkeydown="if(event.key==='Enter')askGuide()"><button class="btn mini" onclick="askGuide()">Ask</button></div></div>
 <div id="gout"></div>`}
 else if(tab==="board"){await renderBoard()}
 else if(tab==="partners"){await renderPartners()}
 else if(tab==="community"||tab==="chub"||tab==="courses"){go("home")}
 else if(tab==="profile"){renderProfile()}
}

 const v=$("view");if(!j||!j.stats){v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';return}
 const TAGLINE="We are bringing customer service back to this world, not only that, but we are taking it to new heights never been reached before!!";
 v.innerHTML=`
 <div class="card hero" style="background-image:url('hero_office.jpg?v=1')">

 <div class="h2row"><div class="h2">Upcoming Events</div><span class="viewall" onclick="go('events')">View All &#8594;</span></div>
 ${(j.upcoming||[]).map(e=>evCard(e)).join("")||`<div class="card empty" style="background-image:url('ev_bg.jpg?v=1')"><div class="em-ic">${IC.cal}</div><div class="t" style="font-weight:700;margin:6px 0">No events yet.</div><div class="small">Check back soon for upcoming events, trainings, and special announcements.</div></div>`}
 <div class="h2">Latest activity</div>
 ${(j.recent||[]).map(p=>`<div class="post"><span class="pill ${p.channel==="wins"?"win":p.channel==="qa"?"qa":""}">${p.channel}</span><div class="t">${esc(p.title)}</div><div class="meta" style="font-size:11.5px;color:var(--dim)">${esc(p.authorName)} · ${fmt(p.createdAt)}</div></div>`).join("")||'<div class="card"><span class="small">Nothing yet — be the first to post a win.</span></div>'}
`;
}
function isCust(){return member&&(member.audience==="customer"||member.audience==="team"||member.role==="admin"||member.role==="owner"||member.role==="moderator")}
function gateCard(label){return `<div class="card" style="text-align:center;padding:24px 16px"><div class="pill" style="margin-bottom:8px;display:inline-block">${esc(label)}</div><b style="font-size:17px">For customers</b><div class="small" style="margin-top:6px">${member?"This section is for Jertaker International customers. Customer access is set up by the team from the office.":"Sign in with the email your invite went to to see this section."}</div>${member?"":'<div class="row" style="margin-top:12px;justify-content:center"><button class="btn mini" onclick="go(\'profile\')">Sign in</button></div>'}</div>`}
async function renderGated(v,channelName,title,sub,emptyMsg){
 if(!isCust()){v.innerHTML=gateCard(title);return}
 v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';
 const j=await api("posts",{channel:channelName},token);
 if(!j.ok){v.innerHTML=gateCard(title);return}
 v.innerHTML=`<div class="h2">${esc(title)}</div><div class="card"><div class="small">${esc(sub)}</div></div>`+
  ((j.posts||[]).map(p=>`<div class="post"><div class="t">${esc(p.title)}</div><div class="small" style="color:var(--txt);white-space:pre-wrap">${esc(p.body)}</div><div class="meta" style="font-size:11.5px;color:var(--dim);margin-top:6px">${esc(p.authorName)} · ${fmt(p.createdAt)}</div></div>`).join("")||`<div class="card"><span class="small">${esc(emptyMsg)}</span></div>`);
}
async function renderResources(v){
 if(!isCust()){v.innerHTML=gateCard("Resources");return}
 v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';
 const cj=await api("courses",{},token);
 const vids=(cj.courses||[]).filter(c=>c.audience==="customer");
 v.innerHTML=`<div class="h2">Resources</div>`+
 (vids.length?`<div class="card">${vids.map(c=>`<div class="lesson"><div><b>${esc(c.title)}</b><div class="small">${esc(c.description)}</div><div class="row" style="margin-top:4px">${c.videoUrl?`<a class="btn mini" href="${c.videoUrl}" target="_blank" rel="noopener">Watch</a>`:""}${c.resourceUrl?`<a class="btn mini sec" href="${c.resourceUrl}" target="_blank" rel="noopener">Resource</a>`:""}</div></div><span class="dur">${c.durationMin?c.durationMin+" min":""}</span></div>`).join("")}</div>`:'<div class="card"><span class="small">Videos and resources land here as the team adds them.</span></div>');
}
async function renderOther(v){
 if(!isCust()){v.innerHTML=gateCard("Other");return}
 v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';
 const [up,st]=await Promise.all([api("posts",{channel:"customers"},token),api("posts",{channel:"success"},token)]);
 const postHtml2=(p,pill)=>`<div class="post">${pill?`<span class="pill win">${pill}</span>`:""}<div class="t">${esc(p.title)}</div><div class="small" style="color:var(--txt);white-space:pre-wrap">${esc(p.body)}</div><div class="meta" style="font-size:11.5px;color:var(--dim);margin-top:6px">${esc(p.authorName)} · ${fmt(p.createdAt)}</div></div>`;
 v.innerHTML=`<div class="h2">Customer Updates</div>`+
  ((up.posts||[]).map(p=>postHtml2(p,"")).join("")||'<div class="card"><span class="small">No updates yet.</span></div>')+
  `<div class="h2">Success Stories</div>`+
  ((st.posts||[]).map(p=>postHtml2(p,"Success")).join("")||'<div class="card"><span class="small">Be the first — share a result you are proud of.</span></div>')+
  `<div class="card"><div class="row"><button class="btn mini" onclick="scToggle()">Share a result</button></div><div id="scwrap" class="hide" style="margin-top:8px"><label>Title</label><input id="sc_title" maxlength="200"><label>Your result</label><textarea id="sc_body" maxlength="5000"></textarea><button class="btn mini" onclick="submitSuccess()">Post</button></div></div>`+
  `<div class="h2">Account</div><div class="card"><div class="row"><button class="btn mini sec" onclick="go('profile')">My profile</button></div></div>`;
}
function scToggle(){$("scwrap").classList.toggle("hide")}
async function submitSuccess(){const t=$("sc_title").value.trim(),b=$("sc_body").value.trim();if(!t||!b)return toast("Title and story, please");const j=await api("createPost",{channel:"success",title:t,body:b},token);if(j.ok){toast("Shared! Thank you.");render()}else toast(j.error)}
async function renderBoard(){const v=$("view");if(!member){v.innerHTML='<div class="card"><span class="small">Sign in to see the leaderboard.</span></div>';return}
 v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';const j=await api("leaderboard",{},token);
 v.innerHTML=`<div class="h2">Leaderboard</div>`+((j.board||[]).length?`<div class="card">${j.board.map((x,i)=>`<div class="lbrow"><span class="rank">${i+1}</span><div><b>${esc(x.name)}</b><div class="small">${esc(x.audience)}</div></div><span class="pts">${x.points} pts</span></div>`).join("")}</div>`:'<div class="card"><span class="small">Nobody on the board yet — opt in from your Profile.</span></div>')+`<div class="card"><button class="btn mini sec" onclick="go('profile')">Back to profile</button></div>`}
async function renderPartners(){const v=$("view");if(!member){v.innerHTML='<div class="card"><span class="small">Sign in to see the partners list.</span></div>';return}
 v.innerHTML='<div class="card"><span class="small">Loading…</span></div>';const j=await api("partners",{},token);
 v.innerHTML=`<div class="h2">Accountability Partners</div><div class="card"><span class="small">Members who opted in to pair up and push each other on their goals. Opt in from your Profile.</span></div>`+((j.partners||[]).length?(j.partners).map(p=>`<div class="card"><b>${esc(p.name)}</b> <span class="small">${esc(p.audience)}</span>${p.focusArea?`<div class="small">Focus: ${esc(p.focusArea)}</div>`:""}${p.partnerGoal?`<div class="small">Wants a partner to push on: ${esc(p.partnerGoal)}</div>`:""}</div>`).join(""):'<div class="card"><span class="small">No one has opted in yet.</span></div>')+`<div class="card"><button class="btn mini sec" onclick="go('profile')">Back to profile</button></div>`}
function evCard(e){const d=new Date(e.startsAt);const gcal=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.title)}&dates=${fmtG(d)}/${fmtG(new Date(d.getTime()+(e.durationMin||60)*60000))}&details=${encodeURIComponent(e.description||"")}`;
 return `<div class="card"><div class="row" style="align-items:flex-start"><div class="evdate"><b>${d.getDate()}</b><span>${d.toLocaleDateString("en-US",{month:"short"})}</span></div>
 <div style="flex:1"><b>${esc(e.title)}</b><div class="small">${esc(e.description||"")}</div><div class="small" style="margin-top:3px">${fmt(e.startsAt)}${e.host?" · Host: "+esc(e.host):""} · ${e.rsvps||0} going</div></div></div>
 <div class="row" style="margin-top:10px">${e.joinUrl?`<a class="btn mini" href="${e.joinUrl}" target="_blank" rel="noopener">Join</a>`:'<span class="small">Join link posts before the call</span>'}
 <button class="btn mini" onclick="rsvp('${e.id}',this)">RSVP</button>
 <a class="btn mini sec" href="${gcal}" target="_blank" rel="noopener">Google Cal</a>
 <button class="btn mini sec" onclick="ics('${e.id}')">Apple Cal</button></div></div>`}
function fmtG(d){return d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"}
function ics(id){api("events").then(j=>{const e=j.events.find(x=>x.id===id);if(!e)return;const d=new Date(e.startsAt),de=new Date(d.getTime()+(e.durationMin||60)*60000);const z=x=>x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
 const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//VANTRA//Hub//EN","BEGIN:VEVENT","UID:"+e.id+"@vantra","DTSTAMP:"+z(new Date()),"DTSTART:"+z(d),"DTEND:"+z(de),"SUMMARY:"+e.title,"DESCRIPTION:"+(e.description||""),"END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);a.download="vantra-event.ics";document.body.appendChild(a);a.click();a.remove()})}
async function rsvp(id,btn){if(!member)return needLogin();btn.disabled=true;const j=await api("rsvpEvent",{eventId:id},token);if(j.ok){toast("You're in! +5 pts")}else{toast(j.error)}btn.disabled=false}
/* ---------- community ---------- */
function setChan(c){channel=c;render()}
function drawComposer(){$("composer").innerHTML=member
 ?`<div class="card"><label>Title</label><input id="ptitle" maxlength="200"><label>Post</label><textarea id="pbody" maxlength="20000"></textarea><button class="btn" onclick="submitPost()">Post to ${channel==="qa"?"Q&A":channel}</button></div>`
 :`<div class="card"><span class="small">Sign in from your Profile to post, comment and chat.</span></div>`}
async function loadPosts(){const j=await api("posts",{channel});$("postlist").innerHTML=(j.posts||[]).map(p=>postHtml(p)).join("")||'<div class="card"><span class="small">Nothing here yet.</span></div>';
 (j.posts||[]).forEach(p=>{document.querySelectorAll('[data-load="'+p.id+'"]').forEach(el=>loadComments(p.id,el))})}
function postHtml(p){return `<div class="post" id="p_${p.id}"><div class="row"><span class="pill ${p.channel==="wins"?"win":p.channel==="qa"?"qa":""}">${p.channel}</span>${p.pinned?'<span class="pill">Pinned</span>':""}${p.resolved?'<span class="pill res">Answered</span>':""}</div>
 <div class="t">${esc(p.title)}</div><div class="small" style="color:var(--txt);white-space:pre-wrap">${esc(p.body)}</div>
 <div class="meta">${esc(p.authorName)} · ${fmt(p.createdAt)}</div>
 <div class="row"><span class="mini-link" onclick="like('${p.id}',this)">▲ ${p.likes||0}</span><span class="mini-link" data-open="${p.id}" onclick="loadComments('${p.id}',null,true)">Comments</span>${(p.channel==="qa"&&!p.resolved&&member)?"<span class='mini-link' onclick='resolve(\""+p.id+"\")'>Mark answered</span>":""}</div>
 <div data-load="${p.id}" class="hide"></div></div>`}
async function loadComments(id,el,open){const box=document.querySelector('[data-load="'+id+'"]');if(!box)return;if(open){box.classList.toggle("hide");if(!box.classList.contains("hide")&&!box.innerHTML){const j=await api("post",{id});box.innerHTML=j.comments.map(c=>`<div class="cmt"><span class="who">${esc(c.authorName)}</span><br>${esc(c.body)}</div>`).join("")+(member?`<div class="row" style="margin-top:6px"><input id="ci_${id}" placeholder="Add a comment…" maxlength="5000" style="margin:0;flex:1"><button class="btn mini" onclick="comment('${id}')">→</button></div>`:"")}}}
async function comment(id){const v=$("ci_"+id).value.trim();if(!v)return;const j=await api("addComment",{postId:id,body:v},token);if(j.ok){$("ci_"+id).value="";const box=document.querySelector('[data-load="'+id+'"]');box.innerHTML="";const o=document.querySelector('[data-open="'+id+'"]');if(o){}const j2=await api("post",{id});box.innerHTML=j2.comments.map(c=>`<div class="cmt"><span class="who">${esc(c.authorName)}</span><br>${esc(c.body)}</div>`).join("")+`<div class="row" style="margin-top:6px"><input id="ci_${id}" placeholder="Add a comment…" maxlength="5000" style="margin:0;flex:1"><button class="btn mini" onclick="comment('${id}')">→</button></div>`;toast("Comment added · +2 pts")}else toast(j.error)}
async function like(id,el){if(!member)return needLogin();const j=await api("reactPost",{postId:id},token);if(j.ok){el.textContent="▲ "+j.likes}}
async function resolve(id){const j=await api("markResolved",{postId:id},token);if(j.ok){render()}else toast(j.error)}
async function submitPost(){const t=$("ptitle").value.trim(),b=$("pbody").value.trim();if(!t||!b)return toast("Title and body, please");const j=await api("createPost",{channel,title:t,body:b},token);if(j.ok){toast("Posted!");render()}else toast(j.error)}
function needLogin(){toast("Sign in first (Profile)");go("profile")}

async function pollChat(first){const j=await api("chat",{},token);if(!j.ok)return;const ms=j.messages||[];if(!first&&ms.length&&ms[ms.length-1].id!==lastChatId){beep();unread++;drawTabs();if(!chatOpen)toast("New message in live chat")}
 lastChatId=ms.length?ms[ms.length-1].id:null;$("chatmsgs").innerHTML=ms.map(m=>`<div class="cmsg"><span class="who">${esc(m.authorName)}</span> · <span style="color:var(--dim);font-size:10.5px">${fmt(m.createdAt)}</span><br>${esc(m.body)}</div>`).join("");$("chatmsgs").scrollTop=1e6}
function toggleChat(force){chatOpen=force===true?true:!chatOpen;if(chatOpen){unread=0;drawTabs()}$("chatdock").classList.toggle("hide",!chatOpen);if(chatOpen){if(isCust()){pollChat(true);$("chatmsgs").scrollTop=1e6;$("chatform").innerHTML='<input id="chattext" placeholder="Say hi…" maxlength="500" onkeydown="if(event.key===\'Enter\')sendChat()"><button class="btn mini" onclick="sendChat()">→</button>'}else{$("chatmsgs").innerHTML='<div class="cmsg" style="color:var(--dim)">'+(!member?'Sign in to join the live chat.':'Live chat is for customers.')+'</div>';$("chatform").innerHTML='<span class="small" style="padding:6px">'+(!member?'Sign in (Profile) to chat.':'Live chat is for customers.')+'</span>'}}}
setInterval(()=>{if(chatOpen&&isCust())pollChat(false)},8000);
async function sendChat(){const i=$("chattext");if(!i)return;const v=i.value.trim();if(!v)return;if(!member)return needLogin();const j=await api("sendChat",{body:v},token);if(j.ok){i.value="";pollChat(true)}else toast(j.error)}

 out.innerHTML=j.answered?(j.results||[]).map(r=>`<div class="card"><div class="pill">Source</div><b>${esc(r.title)}</b> <span class="small">${esc(r.category)}</span><div class="small" style="color:var(--txt);margin:6px 0;white-space:pre-wrap;line-height:1.5">${esc(r.snippet)}</div>${r.sourceUrl?`<a class="small" href="${r.sourceUrl}" target="_blank" rel="noopener">Open source →</a>`:""}</div>`).join("")+`<p class="small">The Guide searches only approved sources; nothing else.</p>`
 :`<div class="card"><span class="pill" style="background:rgba(255,107,107,.12);color:var(--red);border-color:rgba(255,107,107,.3)">Not in the library</span><p class="small" style="color:var(--txt);margin-top:6px">${esc(j.note)}</p></div>`}

async function renderProfile(){const v=$("view");
 if(!member){v.innerHTML=`<div class="card"><div class="h2">Sign in</div>
  <label>Name</label><input id="sf_name" maxlength="100" placeholder="Your name">
  <label>Email</label><input id="sf_email" type="email" maxlength="200" placeholder="you@email.com">
  <button class="btn" onclick="doSignup()">Continue</button>
  <p class="small" style="margin-top:8px">Use the name and email your invite went to. Customer access is set up by the team.</p></div>`;return}
 const m=member;const prog=Math.round(m.goalProgress||0);
 v.innerHTML=`<div class="h2">My Profile</div>
 <div class="card"><div class="row"><b>${esc(m.name)}</b><span class="pill">${esc(m.audience)}</span><span class="pts" style="margin-left:auto;color:var(--gold2);font-weight:700">${m.points} pts</span></div>
 <div class="small" style="margin-top:6px">Member since ${fmt(m.joinedAt)}</div>
 <label style="margin-top:10px">Bio</label><textarea id="pr_bio" maxlength="500" placeholder="One line about you">${esc(m.bio||"")}</textarea>
 <button class="btn mini" onclick="saveProfile()">Save bio</button>
 <div class="row" style="margin-top:10px"><label style="margin:0"><input type="checkbox" id="pr_lb" ${m.optInLeaderboard?"checked":""} style="width:auto;margin:0 6px 0 0">Show me on the leaderboard</label></div>
 <div class="row"><label style="margin:0"><input type="checkbox" id="pr_pt" ${m.optInPartners?"checked":""} style="width:auto;margin:0 6px 0 0">List me for accountability partners</label></div>
 <div class="small" style="margin-top:4px">Accountability partners: members who volunteer to pair up and push each other on their goals. Check this and your name, focus area and partner goal show up on the Partners list (Members area below) — only signed-in members can see it, and nobody appears unless they opt in.</div>
 <button class="btn mini" style="margin-top:8px" onclick="saveProfile()">Save choices</button></div>
 <div class="card"><div class="h2">Members area</div>
 <div class="row"><div class="chip" onclick="go('board')">🏆 Leaderboard</div><div class="chip" onclick="go('partners')">🤝 Partners</div></div>
 <div class="small" style="margin-top:6px">Members only — never shown to the public home page.</div></div>
 <div class="card"><div class="h2">My Goal</div>
 <label>What are you going after?</label><input id="pr_goal" maxlength="300" value="${esc(m.goalText||"")}" placeholder="e.g. Share two results I'm proud of this month">
 <div class="goalbar"><i style="width:${prog}%"></i></div><span class="small">${prog}% — progress moves on its own as you finish things: share a result, post, comment or RSVP. Set a new goal and it starts over.</span>
 <button class="btn mini" onclick="saveProfile()">Save goal</button></div>
 <div class="card"><div class="h2">Partner matching</div>
 <label>Focus area</label><input id="pr_focus" maxlength="100" value="${esc(m.focusArea||"")}" placeholder="e.g. Products, support, growing my business">
 <label>Partner goal</label><input id="pr_pgoal" maxlength="300" value="${esc(m.partnerGoal||"")}" placeholder="What an accountability partner should push you on">
 <button class="btn mini" onclick="saveProfile()">Save</button></div>
 <button class="btn sec" onclick="logout()">Log out</button>`}
async function saveProfile(){const patch={bio:$("pr_bio").value,goalText:$("pr_goal").value,focusArea:$("pr_focus").value,partnerGoal:$("pr_pgoal").value,optInLeaderboard:$("pr_lb").checked,optInPartners:$("pr_pt").checked};
 const j=await api("setProfile",patch,token);if(j.ok){member=j.member;localStorage.setItem(MEMBER_KEY,JSON.stringify(member));setHeader();toast("Saved")}else toast(j.error)}
async function doSignup(){const name=$("sf_name").value.trim(),email=$("sf_email").value.trim(),audience="member";
 if(!name||!email)return toast("Name and email, please");const j=await api("signup",{name,email,audience});
 if(j.ok){token=j.token;member=j.member;localStorage.setItem(TOKEN_KEY,token);localStorage.setItem(MEMBER_KEY,JSON.stringify(member));setHeader();toast(j.note);landByRole()}else toast(j.error)}
/* ---------- role routing ---------- */
// A customer lands here, in the customer hub. Anyone who is not a customer belongs in the
// other hubs (Community, Transformation Hub) — separate places, built later, never tabs here.
const OTHER_HUB_URL=null; // set when those hubs exist
function landByRole(){
 if(isCust()){tab="home";render();return}
 if(OTHER_HUB_URL){location.href=OTHER_HUB_URL;return}
 tab="profile";render();
}
/* ---------- boot ---------- */
setHeader();render();
// keep the signed-in member fresh: points and goal progress move server-side
if(token){api("me",{},token).then(j=>{if(j.ok){member=j.member;localStorage.setItem(MEMBER_KEY,JSON.stringify(member));setHeader();if(tab==="profile")render()}})}
</script>
</body>
</html>
